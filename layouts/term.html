{{ define "main" }}
<h1>{{ .Title }}</h1>
  {{ .Content }}
  <ol style="list-style-type:none">
  {{ range .Pages }}
  {{ $dateMachinePublished := .Date | time.Format "2006-01-02T15:04:05-07:00" }}
  {{ $dateHumanPublished := .Date | time.Format "2006-01-02" }}
            <li><a href="{{ .RelPermalink }}"><time datetime="{{$dateMachinePublished}}">{{$dateHumanPublished}}</time> - {{ .LinkTitle }}</a></li>
    {{ end }}
</ol>
{{ end }}
